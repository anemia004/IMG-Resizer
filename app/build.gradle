plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.imgresizer'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.imgresizer"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // No extra dependencies needed - WebView is part of Android SDK
}
