plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.imgresizer'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.imgresizer"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            storeFile file("${System.getProperty("user.home")}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // sign release with debug key
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    // No extra dependencies needed
}
